# Buildkite agent on ac-box. Ubuntu+Flox image from the plugin Dockerfile,
# plus a loopback-only MinIO Nix binary cache. Jobs write /var/lib/ac-host
# and recycle via the host Docker socket. No SSH. Do not publish 9000/9001
# off localhost.
#
#   cp compose/env.buildkite.example compose/.env.buildkite
#   # paste token + cache secrets (see docs/ci-cd.md)
#   docker compose -f compose/docker-compose.buildkite.yml --env-file compose/.env.buildkite up -d --build
#
# First image build is heavy (flox + SEED_PACKAGES). Keep it off race night.
#
# CPU FENCING (cgroup_parent, below)
#
# Every service here sets `cgroup_parent: batch.slice`, the slice homelab's
# tenant contract creates for the batch tier. Without it a Nix build in this
# agent can take all 56 threads, including the cores the live race servers run
# on -- verified: the agent's effective cpuset was 0-55.
#
# It has to be set HERE, on the containers, and cannot be solved by wrapping
# this stack in a systemd unit. Container cgroup placement is decided by
# dockerd, not by the cgroup of whoever invoked docker: these containers are
# started from an SSH session (user.slice) yet land in system.slice, as
# siblings of any invoking unit rather than children of its slice.
#
# Verified on ac-box (systemd cgroup driver, cgroup v2):
#   docker run --rm --cgroup-parent=batch.slice alpine cat \
#     /sys/fs/cgroup/cpuset.cpus.effective   ->  28-55
#   docker run --rm                   alpine ... same path  ->  0-55
#
# The 28-55 above is the value that WAS observed, and it turned out to be a bug
# in homelab rather than a sane fence: on this box CPUs 28-55 are the SMT
# siblings of 0-27, one per physical core, so batch was not separated from the
# race servers at all -- it was given the second thread of every core they ran
# on. homelab now computes the fence in physical cores, and batch has its own
# block rather than sharing background's. Expect roughly "26-27,54-55" here;
# re-run the check above rather than trusting either number.
#
# batch.slice also carries MemoryMax, derived from the tier's share of declared
# capacity: 12.5 GiB on ac-box since the share went to 0.05 (it was ~25 GiB at
# 0.10; the difference went to background for klein 9B). If a build ever OOMs,
# the share in homelab's hosts/<host>/host.nix is one number to revisit -- but
# not the first. One did OOM, 17 Sep 2026: agent-hub build 6 compiled the
# ik_llama.cpp fork under the flox plugin, ninja ran `-j4` because the
# container's nproc is 4 (batch's two physical cores plus their SMT siblings),
# and four cc1plus on the fork's iqk template units hit the ceiling exactly
# (MemoryPeak == MemoryMax; `g++: fatal error: Killed signal terminated
# program cc1plus`). homelab's tier comment already assumed "the agent's builds
# run -j2 on two cores"; `cores = 2` in NIX_CONFIG below makes that true
# (nix passes it as NIX_BUILD_CORES, which ninja and make honour), so a build
# uses the two cores it owns and half the memory, rather than the model
# server's ceiling being cut to fit a compile.
#
# cgroup_parent applies at container CREATION. Existing containers keep their
# old placement until recreated, and recreating the agent kills the process that
# deploys this box -- so adopt this from a plain SSH session, never through a
# pipeline step running on the agent itself.
#
# NIX SANDBOX (privileged + NIX_CONFIG on the agent, below)
#
# Nix's Linux defaults are sandbox = true AND sandbox-fallback = true, and the
# fallback is the bug: under Docker's default seccomp profile a clone() with
# any CLONE_NEW* flag is denied unless the container has CAP_SYS_ADMIN, so
# Nix's namespace probe fails and Nix silently (debug level) builds without a
# sandbox -- as root, on this container's real filesystem, with
# HOME=/homeless-shelter. ac-host's own pipeline never noticed because it
# evaluates without building. homelab's flake check builds the whole ac-box
# toplevel, and the first ones ever (14 Sep 2026, builds 2 and 3) hit a Go
# program in the closure that no cache had (sops-install-secrets): Go 1.25's
# telemetry created /homeless-shelter/.config/go/telemetry, and Nix refuses
# every later unsandboxed build while that directory exists. Cleared by hand,
# build 3 recreated it in 28 s.
#
# Two settings, and both are needed:
#
#   security_opt seccomp=unconfined lets clone/unshare/mount/pivot_root
#   through. That is everything the sandbox needs: Nix builds inside its own
#   user namespace (the builder is uid 1000 there, mapped onto this
#   container's root), so no capability is added. Checked in a container,
#   Nix 2.35, Docker 29, kernel 6.18, with sandbox-fallback = false so a
#   sandbox that did not engage was an error rather than a quiet build:
#     default                        -> "this system does not support the
#                                       kernel namespaces ..."
#     cap_add SYS_ADMIN only         -> "cannot pivot old root directory ...
#                                       Operation not permitted" (pivot_root
#                                       is not in the default profile at all)
#     seccomp=unconfined only        -> sandbox engages: the builder sees no
#                                       /root and no /nix/var, and its write
#                                       to $HOME is refused
#     privileged                     -> same as the line above
#   ON AC-BOX ITSELF (14 Sep 2026, this image: flox-bundled Nix 2.31.5, Docker
#   29.7.2, NixOS 26.05 kernel) the table is shorter: seccomp=unconfined, and
#   seccomp=unconfined + cap_add SYS_ADMIN, BOTH still fail with "does not
#   support the kernel namespaces"; only privileged engages the sandbox. Proven
#   with throwaway `docker run --rm` containers of this very image and a
#   one-line derivation, sandbox-fallback = false. So: privileged, decided by
#   the operator 14 Sep. It also unmasks /proc and hands over host devices,
#   which Nix did not ask for -- but not new privilege: the container already
#   mounts /var/run/docker.sock, which is root on the host.
#
#   NIX_CONFIG (in the agent's environment) sets sandbox-fallback = false, so
#   the next time the sandbox cannot engage the build FAILS with the
#   "kernel namespaces" error above instead of reproducing this bug. It is
#   an environment variable, not an edit to /etc/nix/nix.conf, because that
#   file belongs to the plugin image (build-users-group =, include
#   flox.conf, the baked substituter) and the plugin's environment hook
#   appends to it at every job; nix merges NIX_CONFIG over the file. Both
#   readers get it: the daemon, started by /docker-entrypoint.d/10-nix-daemon
#   from this environment, and the job's nix client, since the agent passes
#   its environment to jobs (how S3_CACHE_* reaches the plugin hook today).
#   The plugin sets no NIX_CONFIG of its own, so nothing overwrites it.
#
# The flake check builds the full toplevel on this agent. Once the MinIO cache
# holds paths signed by flox-binary-cache-2 that is mostly substitution; the
# first builds after this lands compile whatever the cache lacks, sandboxed,
# and S3_CACHE_PUSH writes it back.
#
# If the "kernel namespaces" error ever appears with this in place, the
# follow-up is privileged: true (verified above) -- never sandbox-fallback =
# true, which is the silent version of this bug.

name: ac-host-ci

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    cgroup_parent: batch.slice
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    cgroup_parent: batch.slice
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
      S3_CACHE_ACCESS_KEY_ID: ${S3_CACHE_ACCESS_KEY_ID:?set S3_CACHE_ACCESS_KEY_ID}
      S3_CACHE_SECRET_ACCESS_KEY: ${S3_CACHE_SECRET_ACCESS_KEY:?set S3_CACHE_SECRET_ACCESS_KEY}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  agent:
    # The one that matters: this is where `nix build` runs.
    cgroup_parent: batch.slice
    build:
      context: "${FLOX_PLUGIN_CONTEXT:-https://github.com/imkarrer/flox-buildkite-plugin.git#main}"
      dockerfile: Dockerfile
      args:
        FLOX_VERSION: ${FLOX_VERSION:-1.14.0}
        S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
        S3_CACHE_ENDPOINT: http://minio:9000
        S3_CACHE_REGION: us-east-1
        S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo="
        # Same pkg-paths the ac-host Flox env uses (no unused gh).
        SEED_PACKAGES: ${SEED_PACKAGES:-python312Full git rsync nixfmt-rfc-style python312Packages.numpy python312Packages.pillow python312Packages.scipy}
    image: ac-host-buildkite-agent:flox
    restart: unless-stopped
    user: "0:0"
    # NIX SANDBOX (header above): let Nix create the namespaces its sandbox is
    # made of. On ac-box only privileged does; the narrower sets are in the
    # header with the error each one gave.
    privileged: true
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      BUILDKITE_AGENT_TOKEN: ${BUILDKITE_AGENT_TOKEN:?set BUILDKITE_AGENT_TOKEN}
      BUILDKITE_AGENT_TAGS: ${BUILDKITE_AGENT_TAGS:-queue=self}
      BUILDKITE_AGENT_NAME: ${BUILDKITE_AGENT_NAME:-ac-box}
      # NIX SANDBOX (header above). sandbox = true is already the Linux
      # default; sandbox-fallback = false is the fix, so a sandbox that cannot
      # engage fails the job instead of building as root on this filesystem.
      # cores = 2: the CPU FENCING header, last paragraph -- a build gets the
      # two physical cores batch owns, not their siblings as well, and the
      # memory that goes with two compilers rather than four.
      NIX_CONFIG: |
        sandbox = true
        sandbox-fallback = false
        cores = 2
      AC_STATE: /var/lib/ac-host
      AC_CONTENT: /var/lib/ac-host/content
      AC_SRC: /var/lib/ac-host/src
      AC_BUILD: /var/lib/ac-host/build
      AC_SERVE_CONTENT: /var/lib/ac-host/content
      AC_PAGES_CHECKOUT: ${AC_PAGES_CHECKOUT:-}
      AC_PAGES_PUSH: ${AC_PAGES_PUSH:-0}
      # ci_publish_pages.py publishes the site through the Contents API when
      # AC_PAGES_CHECKOUT is empty, using the same credential and repo
      # push_status.py already writes leaderboard.json with. That avoids a
      # long-lived clone on the box, which is state nothing reconciles.
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
      GITHUB_STATUS_REPO: ${GITHUB_STATUS_REPO:-}
      GITHUB_STATUS_BRANCH: ${GITHUB_STATUS_BRANCH:-main}
      # homelab's bump-lock step (scripts/hub-bump-lock.sh there) pushes a
      # flake.lock bump to imkarrer/homelab when a tenant build goes green.
      # A separate credential from GITHUB_STATUS_TOKEN on purpose: that one
      # is scoped to the pages repo, this one to homelab, and neither should
      # be able to do the other's job. Empty means the step skips, loudly.
      HOMELAB_PUSH_TOKEN: ${HOMELAB_PUSH_TOKEN:-}
      # A flox tenant's push step (home-arcade scripts/ci_push.sh, ADR 0009
      # step 2) pushes a generation to FloxHub with this; `flox push` reads
      # it non-interactively and nothing is persisted in the container.
      # homelab renders it into ci-env from sops (floxhub-token, a 30-day
      # JWT rotated by hand). Empty means the push step skips, loudly, and
      # no environment is staged on the box.
      FLOX_FLOXHUB_TOKEN: ${FLOX_FLOXHUB_TOKEN:-}
      # The one private tenant repo, cloned over HTTPS: git rewrites exactly
      # that repo's URL to carry the token (a prefix match, so the .git
      # suffix Buildkite clones with is covered). Every other github.com URL
      # is untouched, and the agent logs the URL it was given, not the
      # rewritten one. Empty means the rewrite carries no token and a private
      # clone fails the way it does today. Fine-grained, Contents read only.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${BUILDKITE_CLONE_TOKEN:-}@github.com/imkarrer/inquire-platform.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/imkarrer/inquire-platform
      AWS_ACCESS_KEY_ID: ${S3_CACHE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_CACHE_SECRET_ACCESS_KEY}
      AWS_EC2_METADATA_DISABLED: "true"
      # Non-secret cache identity. The plugin reads these so pipelines
      # do not repeat s3-cache-* on every step.
      S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
      S3_CACHE_ENDPOINT: ${S3_CACHE_ENDPOINT:-http://minio:9000}
      S3_CACHE_REGION: ${S3_CACHE_REGION:-us-east-1}
      S3_CACHE_PUBLIC_KEY: ${S3_CACHE_PUBLIC_KEY:-flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo=}
      S3_CACHE_PUSH: ${S3_CACHE_PUSH:-true}
      S3_CACHE_SIGNING_KEY: ${S3_CACHE_SIGNING_KEY:?set S3_CACHE_SIGNING_KEY}
    volumes:
      - /var/lib/ac-host:/var/lib/ac-host
      # The platform's deploy state, NOT this tenant's. homelab's Buildkite
      # pipeline stages the system-closure revision it has just proven green
      # into /var/lib/homelab/pending-closure.json, and a systemd unit on the
      # box (homelab's modules/deploy) applies it inside the maintenance
      # window. That pipeline runs on THIS agent, so the agent needs the path.
      #
      # Mounted separately rather than staged under /var/lib/ac-host, which
      # is already mounted and would have been easier: that directory is the
      # racing tenant's state, and the closure's deploy record is a platform
      # fact. Borrowing a tenant's state directory for a platform record is
      # the coupling homelab exists to undo (ADR 0006 in that repo says so
      # in as many words). Docker creates the host directory if it is absent.
      #
      # Recreating the agent container is what makes this take effect --
      # `docker compose up -d` does that on a changed definition. Under
      # systemd that is `ac-host-ci.service` starting: a reboot, or a
      # deliberate restart from a plain SSH session. Never from a Buildkite
      # step (HAZARD 2 in homelab's modules/ci).
      - /var/lib/homelab:/var/lib/homelab
      - /var/run/docker.sock:/var/run/docker.sock
      - buildkite-builds:/buildkite/builds
      - buildkite-nix:/nix

volumes:
  buildkite-builds:
  buildkite-nix:
  minio-data:
