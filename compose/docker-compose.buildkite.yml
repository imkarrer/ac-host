# Buildkite agent on arcade-box: since 26 Sep 2026 (homelab ADR 0010) the only
# agent, queue=self; until then it ran on the Z840. Ubuntu+Flox image from the
# plugin Dockerfile, plus a loopback-only MinIO Nix binary cache. Jobs write
# /var/lib/ac-host and recycle via the host Docker socket. No SSH. Do not
# publish 9000/9001 off localhost.
#
# On arcade-box, homelab's ac-host-ci.service runs this file (modules/ci there)
# with the sops-rendered /run/secrets/rendered/ci-env as its --env-file. By
# hand, on a host without that unit:
#
#   cp compose/env.buildkite.example compose/.env.buildkite
#   # paste token + cache secrets (see docs/ci-cd.md)
#   docker compose -f compose/docker-compose.buildkite.yml --env-file compose/.env.buildkite up -d --build
#
# First image build is heavy (flox + SEED_PACKAGES). Keep it off race night.
#
# CPU/MEMORY FENCING (cgroup_parent, below)
#
# Every service here sets `cgroup_parent: batch.slice`, the slice homelab's
# tenant contract creates for the batch tier. Without it dockerd puts these
# containers in system.slice, under no tier's weight or ceiling.
#
# It has to be set HERE, on the containers, and cannot be solved by wrapping
# this stack in a systemd unit. Container cgroup placement is decided by
# dockerd, not by the cgroup of whoever invoked docker: these containers are
# started from an SSH session (user.slice) yet land in system.slice, as
# siblings of any invoking unit rather than children of its slice.
#
# ON ARCADE-BOX (i7-8700T, 6 cores / 12 threads, 31 GiB declared) batch.slice
# is weighted and capped, not fenced. homelab sets no AllowedCPUs on this host
# (hosts/arcade-box/configuration.nix, "no cpuset fence", ADR 0010): a fence
# carved out of six cores would sit idle most of the day. So a build sees
# every CPU, competes by CPUWeight -- batch 300 against the lobbies' 500 in
# critical.slice, consulted only under contention -- and MemoryMax is the hard
# limit: the tier's 0.45 memoryShare of declared capacity, in whole MiB
# (homelab's modules/tenant/resources.nix),
#
#   floor(0.45 x 31 GiB x 1024) = floor(14284.8) = 14284 MiB
#                               = 14977859584 bytes, ~13.9 GiB,
#
# shared by this stack (agent, MinIO) and the host's nix-daemon. Read live 28
# Sep 2026: `systemctl show batch.slice -p MemoryMax` -> 14977859584,
# CPUWeight 300, AllowedCPUs empty; the agent's cpuset.cpus.effective 0-11;
# memory.events oom_kill 0 since the slice came up on 26 Sep -- but max 4664 and
# memory.peak at the ceiling: builds do reach it, mostly as page cache the
# kernel reclaims (~6.0 of ~7.8 GB current was file cache). If a build ever
# OOMs, the share in homelab's hosts/<host>/configuration.nix is one number to
# revisit -- but not the first: `cores = 2` below is.
#
# ON THE Z840 (the agent's host until 26 Sep 2026; 28 cores / 56 threads)
# batch WAS fenced, and what that taught is kept here:
#
#   Without cgroup_parent a Nix build in this agent could take all 56 threads,
#   including the cores the race servers ran on -- the agent's effective
#   cpuset was 0-55. Verified there (systemd cgroup driver, cgroup v2):
#     docker run --rm --cgroup-parent=batch.slice alpine cat \
#       /sys/fs/cgroup/cpuset.cpus.effective   ->  28-55
#     docker run --rm                   alpine ... same path  ->  0-55
#   The 28-55 turned out to be a bug in homelab rather than a sane fence: CPUs
#   28-55 were the SMT siblings of 0-27, one per physical core, so batch was
#   given the second thread of every core the race servers ran on. homelab now
#   computes a fence in physical cores, with batch in its own block, on a host
#   that has one.
#
#   batch's MemoryMax there was 12.5 GiB at a 0.05 share (~25 GiB at 0.10; the
#   difference went to background for klein 9B), and a build did OOM, 17 Sep
#   2026: agent-hub build 6 compiled the ik_llama.cpp fork under the flox
#   plugin, ninja ran `-j4` because the container's nproc was 4 (batch's two
#   physical cores plus their SMT siblings), and four cc1plus on the fork's iqk
#   template units hit the ceiling exactly (MemoryPeak == MemoryMax; `g++:
#   fatal error: Killed signal terminated program cc1plus`). homelab's tier
#   comment already assumed "the agent's builds run -j2 on two cores";
#   `cores = 2` in NIX_CONFIG below made that true (nix passes it as
#   NIX_BUILD_CORES, which ninja and make honour), so a build used the two
#   cores it owned and half the memory, rather than the model server's ceiling
#   being cut to fit a compile.
#
# `cores = 2` stays on arcade-box for the memory half of that reason. With no
# fence the agent's cpuset is 0-11, so a build left to nproc would run twelve
# compilers under the same ~13.9 GiB. homelab sized batch here on the Z840's
# record -- its 12.5 GiB held every build at cores = 2 (hosts/arcade-box/
# configuration.nix, batch) -- and that record is for two compilers.
#
# cgroup_parent applies at container CREATION. Existing containers keep their
# old placement until recreated, and recreating the agent kills the process that
# deploys this box -- so adopt this from a plain SSH session, never through a
# pipeline step running on the agent itself.
#
# NIX SANDBOX (privileged + NIX_CONFIG on the agent, below)
#
# Nix's Linux defaults are sandbox = true AND sandbox-fallback = true, and the
# fallback is the bug: under Docker's default seccomp profile a clone() with
# any CLONE_NEW* flag is denied unless the container has CAP_SYS_ADMIN, so
# Nix's namespace probe fails and Nix silently (debug level) builds without a
# sandbox -- as root, on this container's real filesystem, with
# HOME=/homeless-shelter. ac-host's own pipeline never noticed because it
# evaluates without building. homelab's flake check builds each host's whole
# toplevel (in mid-September the Z840's, the only host then), and the first
# ones ever (14 Sep 2026, builds 2 and 3) hit a Go program in the closure that
# no cache had (sops-install-secrets): Go 1.25's telemetry created
# /homeless-shelter/.config/go/telemetry, and Nix refuses every later
# unsandboxed build while that directory exists. Cleared by hand, build 3
# recreated it in 28 s.
#
# Two settings, and both are needed:
#
#   security_opt seccomp=unconfined lets clone/unshare/mount/pivot_root
#   through. That is everything the sandbox needs: Nix builds inside its own
#   user namespace (the builder is uid 1000 there, mapped onto this
#   container's root), so no capability is added. Checked in a container,
#   Nix 2.35, Docker 29, kernel 6.18, with sandbox-fallback = false so a
#   sandbox that did not engage was an error rather than a quiet build:
#     default                        -> "this system does not support the
#                                       kernel namespaces ..."
#     cap_add SYS_ADMIN only         -> "cannot pivot old root directory ...
#                                       Operation not permitted" (pivot_root
#                                       is not in the default profile at all)
#     seccomp=unconfined only        -> sandbox engages: the builder sees no
#                                       /root and no /nix/var, and its write
#                                       to $HOME is refused
#     privileged                     -> same as the line above
#   ON THE Z840 ITSELF, the agent's host until 26 Sep 2026 (14 Sep 2026, this
#   image: flox-bundled Nix 2.31.5, Docker 29.7.2, NixOS 26.05 kernel), the
#   table was shorter: seccomp=unconfined, and seccomp=unconfined + cap_add
#   SYS_ADMIN, BOTH still failed with "does not support the kernel
#   namespaces"; only privileged engaged the sandbox. Proven with throwaway
#   `docker run --rm` containers of this very image and a one-line derivation,
#   sandbox-fallback = false. So: privileged, decided by the operator 14 Sep;
#   arcade-box took it over with this file, and the narrower sets have not
#   been re-tried there. It also unmasks /proc and hands over host devices,
#   which Nix did not ask for -- but not new privilege: the container already
#   mounts /var/run/docker.sock, which is root on the host.
#
#   NIX_CONFIG (in the agent's environment) sets sandbox-fallback = false, so
#   the next time the sandbox cannot engage the build FAILS with the
#   "kernel namespaces" error above instead of reproducing this bug. It is
#   an environment variable, not an edit to /etc/nix/nix.conf, because that
#   file belongs to the plugin image (build-users-group =, include
#   flox.conf, the baked substituter) and the plugin's environment hook
#   appends to it at every job; nix merges NIX_CONFIG over the file. Both
#   readers get it: the daemon, started by /docker-entrypoint.d/10-nix-daemon
#   from this environment, and the job's nix client, since the agent passes
#   its environment to jobs (how S3_CACHE_* reaches the plugin hook today).
#   The plugin sets no NIX_CONFIG of its own, so nothing overwrites it.
#
# The flake check builds the full toplevel on this agent. Once the MinIO cache
# holds paths signed by flox-binary-cache-2 that is mostly substitution; the
# first builds after this lands compile whatever the cache lacks, sandboxed,
# and S3_CACHE_PUSH writes it back.
#
# If the "kernel namespaces" error ever appears with this in place, the
# follow-up is privileged: true (verified above) -- never sandbox-fallback =
# true, which is the silent version of this bug.

name: ac-host-ci

services:
  minio:
    # LOCAL IMAGE, never pulled. Built by homelab from its nixpkgs pin
    # (modules/ci/default.nix, dockerTools) and `docker load`ed into this
    # daemon by ac-host-ci.service's ExecStartPre, before this stack
    # starts: the upstream minio/minio and minio/mc images left every
    # public registry on/after 26 Sep 2026 (Docker Hub 404s the repos,
    # quay.io grants anonymous pulls nothing, the community edition is
    # source-only; homelab-ygc.11). The tag is constant on purpose -- the
    # bytes move with homelab's flake.lock, and compose recreates these
    # two services when the image ID the tag resolves to changes (the
    # agent's recreate paragraph below). Never `pull_policy: always` here:
    # there is nothing to pull, and a `compose pull` would fail rather than
    # refresh. If the load has not happened on this daemon, `up -d` fails
    # on minio and the agent, behind minio-init, does not come up -- so
    # homelab's half switches first.
    image: homelab/minio:nixpkgs
    restart: unless-stopped
    cgroup_parent: batch.slice
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    # Same origin as minio above: homelab's dockerTools image of nixpkgs'
    # minio-client, loaded before this stack starts. It ships /bin/sh
    # (busybox) and `mc` on PATH, which is all minio-init.sh needs.
    image: homelab/minio-client:nixpkgs
    cgroup_parent: batch.slice
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
      S3_CACHE_ACCESS_KEY_ID: ${S3_CACHE_ACCESS_KEY_ID:?set S3_CACHE_ACCESS_KEY_ID}
      S3_CACHE_SECRET_ACCESS_KEY: ${S3_CACHE_SECRET_ACCESS_KEY:?set S3_CACHE_SECRET_ACCESS_KEY}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  agent:
    # The one that matters: this is where `nix build` runs.
    cgroup_parent: batch.slice
    build:
      context: "${FLOX_PLUGIN_CONTEXT:-https://github.com/imkarrer/flox-buildkite-plugin.git#main}"
      dockerfile: Dockerfile
      args:
        # The agent's flox is the version every tenant lock is read with in
        # CI. Kept equal to the box's (homelab flake.nix `flox` input, v1.16.0
        # since 03a2285, 18 Sep 2026): a lock written by a newer flox can be
        # unreadable by an older one, so the readers -- box, this agent, the
        # operator's WSL -- move before any manifest's schema-version does.
        FLOX_VERSION: ${FLOX_VERSION:-1.16.0}
        S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
        S3_CACHE_ENDPOINT: http://minio:9000
        S3_CACHE_REGION: us-east-1
        S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo="
        # Same pkg-paths the ac-host Flox env uses (no unused gh).
        SEED_PACKAGES: ${SEED_PACKAGES:-python312Full git rsync nixfmt-rfc-style python312Packages.numpy python312Packages.pillow python312Packages.scipy}
    image: ac-host-buildkite-agent:flox
    restart: unless-stopped
    user: "0:0"
    # NIX SANDBOX (header above): let Nix create the namespaces its sandbox is
    # made of. On the Z840 only privileged did (not re-tried on arcade-box);
    # the narrower sets are in the header with the error each one gave.
    privileged: true
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      BUILDKITE_AGENT_TOKEN: ${BUILDKITE_AGENT_TOKEN:?set BUILDKITE_AGENT_TOKEN}
      BUILDKITE_AGENT_TAGS: ${BUILDKITE_AGENT_TAGS:-queue=self}
      # arcade-box's value comes from the env file: homelab renders
      # BUILDKITE_AGENT_NAME=<homelab.host.name> into ci-env
      # (modules/platform/secrets.nix), `arcade-box` there. This default only
      # names an agent brought up by hand without that file.
      BUILDKITE_AGENT_NAME: ${BUILDKITE_AGENT_NAME:-arcade-box}
      # NIX SANDBOX (header above). sandbox = true is already the Linux
      # default; sandbox-fallback = false is the fix, so a sandbox that cannot
      # engage fails the job instead of building as root on this filesystem.
      # cores = 2: the CPU/MEMORY FENCING header -- two compilers per build.
      # On the Z840 that was the two physical cores batch owned; on arcade-box,
      # with no fence, it is what keeps a build's memory inside batch.slice.
      NIX_CONFIG: |
        sandbox = true
        sandbox-fallback = false
        cores = 2
      AC_STATE: /var/lib/ac-host
      AC_CONTENT: /var/lib/ac-host/content
      AC_SRC: /var/lib/ac-host/src
      AC_BUILD: /var/lib/ac-host/build
      AC_SERVE_CONTENT: /var/lib/ac-host/content
      AC_PAGES_CHECKOUT: ${AC_PAGES_CHECKOUT:-}
      AC_PAGES_PUSH: ${AC_PAGES_PUSH:-0}
      # ci_publish_pages.py publishes the site through the Contents API when
      # AC_PAGES_CHECKOUT is empty, using the same credential and repo
      # push_status.py already writes leaderboard.json with. That avoids a
      # long-lived clone on the box, which is state nothing reconciles.
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
      GITHUB_STATUS_REPO: ${GITHUB_STATUS_REPO:-}
      GITHUB_STATUS_BRANCH: ${GITHUB_STATUS_BRANCH:-main}
      # homelab's bump-lock step (scripts/hub-bump-lock.sh there) pushes a
      # flake.lock bump to imkarrer/homelab when a tenant build goes green.
      # A separate credential from GITHUB_STATUS_TOKEN on purpose: that one
      # is scoped to the pages repo, this one to homelab, and neither should
      # be able to do the other's job. Empty means the step skips, loudly.
      HOMELAB_PUSH_TOKEN: ${HOMELAB_PUSH_TOKEN:-}
      # A flox tenant's push step (home-arcade scripts/ci_push.sh, ADR 0009
      # step 2) pushes a generation to FloxHub with this; `flox push` reads
      # it non-interactively and nothing is persisted in the container.
      # homelab renders it into ci-env from sops (floxhub-token, a 30-day
      # JWT rotated by hand). Empty means the push step skips, loudly, and
      # no environment is staged on the box.
      FLOX_FLOXHUB_TOKEN: ${FLOX_FLOXHUB_TOKEN:-}
      # The one private tenant repo, cloned over HTTPS: git rewrites exactly
      # that repo's URL to carry the token (a prefix match, so the .git
      # suffix Buildkite clones with is covered). Every other github.com URL
      # is untouched, and the agent logs the URL it was given, not the
      # rewritten one. Empty means the rewrite carries no token and a private
      # clone fails the way it does today. Fine-grained, Contents read only.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${BUILDKITE_CLONE_TOKEN:-}@github.com/imkarrer/inquire-platform.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/imkarrer/inquire-platform
      AWS_ACCESS_KEY_ID: ${S3_CACHE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_CACHE_SECRET_ACCESS_KEY}
      AWS_EC2_METADATA_DISABLED: "true"
      # Non-secret cache identity. The plugin reads these so pipelines
      # do not repeat s3-cache-* on every step.
      S3_CACHE_BUCKET: ${S3_CACHE_BUCKET:-flox-binary-cache}
      S3_CACHE_ENDPOINT: ${S3_CACHE_ENDPOINT:-http://minio:9000}
      S3_CACHE_REGION: ${S3_CACHE_REGION:-us-east-1}
      S3_CACHE_PUBLIC_KEY: ${S3_CACHE_PUBLIC_KEY:-flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo=}
      S3_CACHE_PUSH: ${S3_CACHE_PUSH:-true}
      S3_CACHE_SIGNING_KEY: ${S3_CACHE_SIGNING_KEY:?set S3_CACHE_SIGNING_KEY}
    volumes:
      - /var/lib/ac-host:/var/lib/ac-host
      # The platform's deploy state, NOT this tenant's. homelab's Buildkite
      # pipeline stages the system-closure revision it has just proven green
      # into /var/lib/homelab/pending-closure.json, and a systemd unit on the
      # box (homelab's modules/deploy) applies it inside the maintenance
      # window. That pipeline runs on THIS agent, so the agent needs the path.
      #
      # Mounted separately rather than staged under /var/lib/ac-host, which
      # is already mounted and would have been easier: that directory is the
      # racing tenant's state, and the closure's deploy record is a platform
      # fact. Borrowing a tenant's state directory for a platform record is
      # the coupling homelab exists to undo (ADR 0006 in that repo says so
      # in as many words). Docker creates the host directory if it is absent.
      #
      # Recreating the agent container is what makes this take effect --
      # `docker compose up -d` does that on a changed definition. Under
      # systemd that is `ac-host-ci.service` starting: a reboot, or a
      # deliberate restart from a plain SSH session. Never from a Buildkite
      # step (HAZARD 2 in homelab's modules/ci).
      # "Changed definition" means THIS service's: compose 5.4.0 (the
      # version on the box and in WSL) recreates a container when its own
      # config hash or image changed, not when a dependency's did. A swap
      # of minio's or minio-init's image above recreates those two and
      # leaves this container running (probed 26 Sep 2026, homelab-ygc.11,
      # with a three-service busybox stack of the same depends_on shape;
      # `--always-recreate-deps` is the opt-in). `--build` is the other
      # way this container moves: a new agent image ID from the plugin's
      # #main is a recreate too.
      - /var/lib/homelab:/var/lib/homelab
      - /var/run/docker.sock:/var/run/docker.sock
      - buildkite-builds:/buildkite/builds
      # The agent's own /nix, so what a job builds persists across
      # recreates. NAMED BY FLOX VERSION, and here is why. The image installs
      # flox from its .deb, which puts the binary in /nix/store and leaves
      # /usr/bin/flox a symlink to it; Docker seeds a named volume from the
      # image's /nix exactly once, when the volume is first created. So a
      # volume born from the 1.14.0 image did not carry 1.16.0's store path,
      # and the first agent recreate after the FLOX_VERSION bump (18 Sep
      # 2026, 21:24 CDT) registered an agent with a dangling /usr/bin/flox:
      # every flox step failed until the volume was dropped by hand. With
      # the version in the name, an upgrade gets a fresh volume seeded from
      # the new image and the old one stays behind as the rollback; a
      # `docker volume rm` of the retired one is hygiene, not repair. The
      # cost of a fresh volume is warmth only: every output CI ever built
      # is in MinIO (the plugin pushes them), so the first jobs substitute.
      # The version is in the volume's `name:` below, so FLOX_VERSION is
      # bumped in one place (the build arg above).
      - buildkite-nix:/nix

volumes:
  buildkite-builds:
  buildkite-nix:
    name: ac-host-ci_buildkite-nix-flox-${FLOX_VERSION:-1.16.0}
  minio-data:
