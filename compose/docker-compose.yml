# CPU/MEMORY FENCING (cgroup_parent, below)
#
# Every service that compose actually STARTS sets `cgroup_parent:
# critical.slice`, the slice homelab's tenant contract creates for the tier
# this tenant declares (homelab.tenants.assetto.tier = "critical").
#
# Same reasoning as compose/docker-compose.buildkite.yml, and the same trap:
# container cgroup placement is decided by dockerd, not by the cgroup of
# whoever invoked docker, so these land in system.slice as siblings of any
# invoking unit rather than children of its slice. Wrapping the stack in a
# systemd unit does not fix it -- and here it CANNOT be fixed that way even in
# principle, because resources.nix deliberately never assigns Slice= to this
# tenant: assetto is tier = critical AND quiet.drainable = false, so it is
# excluded from slice assignment precisely to avoid the restart that applying
# Slice= would force (ac-host-static's ExecStop is `docker rm -f`).
#
# Verified on ac-box before this change: every ac-host container reported
# CgroupParent="" and ran under system.slice with MemoryMax=infinity and the
# full 0-55 cpuset. So the racing stack was the one tenant on the box with no
# resource ceiling at all.
#
# critical.slice carries MemoryMax (~25 GiB on ac-box, derived from the tier's
# share of declared capacity) and CPUWeight, but deliberately NO AllowedCPUs:
# critical is fenced AROUND, never confined itself, so races can still burst
# onto every core when the background/batch tiers are idle. If a lobby ever
# OOMs, the number to revisit is the tier share in homelab's
# hosts/<host>/host.nix and configuration.nix, not this file.
#
# cgroup_parent applies at container CREATION. Existing containers keep their
# old placement until recreated -- and recreating these means dropping live
# lobbies, so adopt it in a maintenance window with no drivers connected.
#
# THE PYTHON IMAGE (auth, details, plugin, bot)
#
# All four run `ac-host-env`, which is .flox/env/manifest.toml containerized:
# CI builds it with `flox containerize` (scripts/ci_containerize.sh, the
# `image` step in .buildkite/pipeline.yml) and loads it straight into this
# box's Docker daemon -- the agent shares /var/run/docker.sock -- as
# `ac-host-env:<sha>`, promoted to `ac-host-env:latest` once the whole build
# is green. Nothing here has a `build:` any more and nothing is pulled: the
# image is either already in the daemon or CI has not run since this landed.
#
# The code is NOT in the image. This tree is bind-mounted at /repo (the bot
# already did that for the livery scripts) and each service names its
# entrypoint under it; the manifest's [profile] puts /repo/{scripts,bot,
# sidecar,shared} on PYTHONPATH, the same four roots the tests import from.
# So a Python change reaches a container through the 03:00 tree sync plus a
# recreate (ci_downtime.py), and the image changes only when the manifest
# does. Either way the window needs neither PyPI nor Docker Hub.
name: ac-host

services:
  auth:
    cgroup_parent: critical.slice
    image: ac-host-env:latest
    network_mode: host
    restart: unless-stopped
    command: ["python", "-u", "/repo/sidecar/auth.py"]
    environment:
      AUTH_BIND: ${AUTH_BIND:-127.0.0.1:18080}
      AUTH_OPEN: ${AUTH_OPEN:-1}
      AUTH_REQUIRED_ROLE: ${AUTH_REQUIRED_ROLE:-ac-practice}
      WHITELIST_PATH: /data/whitelist.json
    volumes:
      - ${AC_STATE:?set AC_STATE}:/data
      - ..:/repo:ro

  # Image used by `python scripts/acctl.py up-static` for each catalog/statics.json lobby.
  # Not started by `compose up` itself — each lobby is its own container and port.
  # No cgroup_parent here on purpose: compose never creates this container, so a
  # key here would be dead config. The real placement is set by the
  # `--cgroup-parent` flag in acctl.py's run_server_container().
  static:
    build:
      context: ../image
    image: ac-host-server:latest
    network_mode: host
    profiles: ["build"]
    environment:
      STEAMCMD_LOGIN: ${STEAMCMD_LOGIN:-anonymous}
      AC_CFG_DIR: /cfg
      AC_CONTENT: /content
      AC_RESULTS_DIR: /results
    volumes:
      - ac-server:/opt/ac
      - steam:/home/ac/Steam
      - ${AC_CONTENT:?set AC_CONTENT}:/content:ro

  # Template image for `python scripts/acctl.py start-race`.
  # Not started by `compose up`. Same as `static` above: placement comes from
  # run_server_container()'s --cgroup-parent, not from this file.
  race:
    image: ac-host-server:latest
    network_mode: host
    profiles: ["race"]
    environment:
      STEAMCMD_LOGIN: ${STEAMCMD_LOGIN:-anonymous}
      AC_CFG_DIR: /cfg
      AC_CONTENT: /content
      AC_RESULTS_DIR: /results
    volumes:
      - ac-server:/opt/ac
      - steam:/home/ac/Steam
      - ${AC_CONTENT}:/content:ro

  # Content Manager /api/details so Online shows liveries (server name ends with ℹport).
  details:
    cgroup_parent: critical.slice
    image: ac-host-env:latest
    network_mode: host
    restart: unless-stopped
    command: ["python", "-u", "/repo/sidecar/details.py"]
    environment:
      AC_STATE: /data
      AC_CONTENT: /content
      AC_PAGES_URL: ${AC_PAGES_URL:-}
    volumes:
      - ${AC_STATE:?set AC_STATE}:/data:ro
      - ${AC_CONTENT:?set AC_CONTENT}:/content:ro
      - ..:/repo:ro

  # UDP plugin: LAP_COMPLETED → state/leaderboard.json; optional push to GitHub Pages repo
  plugin:
    cgroup_parent: critical.slice
    image: ac-host-env:latest
    network_mode: host
    restart: unless-stopped
    command: ["python", "-u", "/repo/sidecar/plugin.py"]
    environment:
      AC_STATE: /data
      AC_CATALOG: /catalog
      AC_CATALOG_STATICS: ${AC_CATALOG_STATICS:-statics.json}
      PLUGIN_SLOTS: ${PLUGIN_SLOTS:-}
      AC_DIST: /data/dist
      PLUGIN_HOST: 127.0.0.1
      PRACTICE_RESTART_AT: ${PRACTICE_RESTART_AT:-03:00}
      AC_TZ: ${AC_TZ:-America/Chicago}
      TZ: ${AC_TZ:-America/Chicago}
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
      GITHUB_STATUS_REPO: ${GITHUB_STATUS_REPO:-}
      GITHUB_STATUS_BRANCH: ${GITHUB_STATUS_BRANCH:-main}
      GITHUB_STATUS_PATH: ${GITHUB_STATUS_PATH:-leaderboard.json}
      STATUS_EVENT_URL: ${STATUS_EVENT_URL:-}
    volumes:
      - ${AC_STATE:?set AC_STATE}:/data
      - ../catalog:/catalog:ro
      - ..:/repo:ro

  bot:
    cgroup_parent: critical.slice
    image: ac-host-env:latest
    profiles: ["bot"]
    command: ["python", "-u", "/repo/bot/bot.py"]
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_REQUIRED_ROLE: ${AUTH_REQUIRED_ROLE:-ac-practice}
      DISCORD_ADMIN_ROLE: ${DISCORD_ADMIN_ROLE:-ac-admin}
      DISCORD_REVIEW_CHANNEL_ID: ${DISCORD_REVIEW_CHANNEL_ID:-}
      DISCORD_STATUS_CHANNEL_ID: ${DISCORD_STATUS_CHANNEL_ID:-1545234415054225511}
      DISCORD_VERIFY_PROFILE: ${DISCORD_VERIFY_PROFILE:-1}
      PRACTICE_RESTART_AT: ${PRACTICE_RESTART_AT:-03:00}
      AC_TZ: ${AC_TZ:-America/Chicago}
      TZ: ${AC_TZ:-America/Chicago}
      AC_PUBLIC_IP: ${AC_PUBLIC_IP:-}
      AC_PAGES_URL: ${AC_PAGES_URL:-https://simracing.fugazy.dev}
      AC_GITHUB_OWNER: ${AC_GITHUB_OWNER:-imkarrer}
      AC_GITHUB_REPO: ${AC_GITHUB_REPO:-ac-practice}
      AC_CATALOG_STATICS: ${AC_CATALOG_STATICS:-statics.json}
      AC_STATE: /data
      WHITELIST_PATH: /data/whitelist.json
      STEAM_REQUESTS_PATH: /data/steam_requests.json
      AC_CONTENT: /content
      AC_CATALOG: /catalog
      # Numbered liveries are built from the FULL car folders here, not from the
      # slim /content the game servers read (that one has no .kn5 models).
      AC_BUILD: /build
      AC_REPO: /repo
      AC_SERVE_CONTENT: /serve
      AC_GITHUB_TOKEN_FILE: /data/secrets/github-token
      BUILDKITE_API_TOKEN: ${BUILDKITE_API_TOKEN:-}
      BUILDKITE_ORG: ${BUILDKITE_ORG:-}
      BUILDKITE_PIPELINE: ${BUILDKITE_PIPELINE:-ac-host}
      BUILDKITE_PIPELINE_OPS: ${BUILDKITE_PIPELINE_OPS:-ac-host-ops}
      BUILDKITE_PIPELINE_SERIES: ${BUILDKITE_PIPELINE_SERIES:-ac-host-series}
    volumes:
      - ${AC_STATE}:/data
      - ${AC_CONTENT}:/content:ro
      # Same tree as /content, writable, so the pack can drop the generated skin
      # folders where entry_list.ini and the CM details API expect them.
      - ${AC_CONTENT}:/serve
      - ${AC_BUILD:-/var/lib/ac-host/build}:/build
      # /repo carries the bot's own code too now (see THE PYTHON IMAGE above);
      # it was here first for the pack scripts, so a code change never needs
      # an image rebuild.
      - ..:/repo:ro
      - ../catalog:/catalog:ro

volumes:
  ac-server:
  steam:
