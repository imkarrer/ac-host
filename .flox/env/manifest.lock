    "hook": {},
    "profile": {
      "common": "  ac_root=\"${FLOX_ENV_PROJECT:-${AC_REPO:-/repo}}\"\n  export PYTHONPATH=\"$ac_root/scripts:$ac_root/bot:$ac_root/sidecar:$ac_root/shared${PYTHONPATH:+:$PYTHONPATH}\"\n  unset ac_root\n"
    },
    "options": {},
    "build": {
      "ac-host-catlibs": {
        "command": "  set -euo pipefail\n  root=\"$out/lib/ac-host\"\n  mkdir -p \"$root\" \"$out/bin\"\n  cp -r bot sidecar shared scripts \"$root/\"\n  cat > \"$root/check.py\" <<'CHECK'\nimport discord, numpy, scipy.signal, PIL.Image, aiohttp\nimport auth, details, plugin, bot, skin_livery, skin_uv\nprint(\"ac-host-check ok:\", \"numpy\", numpy.__version__, \"scipy\", scipy.__version__, \"Pillow\", PIL.__version__, \"discord.py\", discord.__version__, \"aiohttp\", aiohttp.__version__)\nCHECK\n  font=\"$(readlink -f \"$FLOX_ENV/share/fonts/truetype/DejaVuSans.ttf\")\"\n  for svc in sidecar/auth sidecar/details sidecar/plugin bot/bot check; do\n    bin=\"$out/bin/ac-host-$(basename \"$svc\")\"\n    cat > \"$bin\" <<EOF\n#!/usr/bin/env python3\nimport os, runpy, sys\nroots = [\"$root/scripts\", \"$root/bot\", \"$root/sidecar\", \"$root/shared\"]\nsys.path[:0] = roots\nos.environ[\"PYTHONPATH\"] = \":\".join(roots + [p for p in os.environ.get(\"PYTHONPATH\", \"\").split(\":\") if p])\nos.environ.setdefault(\"AC_NUMBER_FONT\", \"$font\")\nsys.argv[0] = \"$root/$svc.py\"\nrunpy.run_path(sys.argv[0], run_name=\"__main__\")\nEOF\n    chmod +x \"$bin\"\n  done\n",
        "version": "0.0.1",
        "description": "ac-host bot and sidecars on the environment's own catalog libraries (experiment)"
      },
      "ac-host-python": {
        "command": "  mkdir -p \"$out/bin\"\n  py=\"$(readlink -f \"$(command -v python3)\")\"\n  for name in python3 python; do\n    # Flox's build wrapper replaces PYTHONPATH with the runtime libraries;\n    # APP_PYTHONPATH carries the app's own module folders in front of them.\n    cat > \"$out/bin/$name\" <<EOF\n#!/bin/sh\nPYTHONPATH=\"\\${APP_PYTHONPATH:+\\$APP_PYTHONPATH:}\\$PYTHONPATH\" exec $py \"\\$@\"\nEOF\n    chmod +x \"$out/bin/$name\"\n  done\n",
        "version": "0.0.1",
        "description": "This environment's Python with its catalog libraries, importable in run mode (prototype)"
      },
      "ac-host-services": {
        "command": "  set -euo pipefail\n  py=\"$(readlink -f \"$(command -v python3)\")\"\n  font=\"$(readlink -f \"$FLOX_ENV/share/fonts/truetype/DejaVuSans.ttf\")\"\n  libs=\"\"\n  if [ \"$(uname -s)\" = Linux ]; then\n    # PyPI's manylinux wheels expect these from the system; Nix's Python\n    # doesn't provide them, so the wrappers put them on LD_LIBRARY_PATH.\n    libs=\"$(dirname \"$(readlink -f \"$FLOX_ENV/lib/libstdc++.so.6\")\"):$(dirname \"$(readlink -f \"$FLOX_ENV/lib/libz.so.1\")\")\"\n  fi\n  path=\"$(dirname \"$(readlink -f \"$(command -v git)\")\"):$(dirname \"$(readlink -f \"$(command -v rsync)\")\")\"\n\n  uv venv --python \"$py\" \"$out/venv\"\n  UV_PROJECT_ENVIRONMENT=\"$out/venv\" uv sync --frozen --no-install-project --python \"$py\"\n\n  root=\"$out/lib/ac-host\"\n  mkdir -p \"$root\" \"$out/bin\"\n  cp -r bot sidecar shared scripts \"$root/\"\n  # ac-host-check imports every service module, including the ones that load\n  # numpy, scipy and Pillow only for some commands, so a smoke test sees them.\n  cat > \"$root/check.py\" <<'CHECK'\nimport discord, numpy, scipy.signal, PIL.Image, aiohttp\nimport auth, details, plugin, bot, skin_livery, skin_uv\nprint(\"ac-host-check ok:\", \"numpy\", numpy.__version__, \"scipy\", scipy.__version__, \"Pillow\", PIL.__version__, \"discord.py\", discord.__version__)\nCHECK\n  for svc in sidecar/auth sidecar/details sidecar/plugin bot/bot check; do\n    bin=\"$out/bin/ac-host-$(basename \"$svc\")\"\n    cat > \"$bin\" <<EOF\n#!$out/venv/bin/python -u\n# Generated by the ac-host-services build. Sets up the environment the\n# service expects, re-executing once so the loader sees LD_LIBRARY_PATH.\nimport os, sys\nenv = os.environ\nif \"$libs\" and env.get(\"AC_HOST_LIBS\") != \"$libs\":\n    env[\"AC_HOST_LIBS\"] = \"$libs\"\n    env[\"LD_LIBRARY_PATH\"] = \"$libs\" + (\":\" + env[\"LD_LIBRARY_PATH\"] if env.get(\"LD_LIBRARY_PATH\") else \"\")\n    os.execv(sys.executable, [sys.executable, \"-u\"] + sys.argv)\nroots = [\"$root/scripts\", \"$root/bot\", \"$root/sidecar\", \"$root/shared\"]\nenv[\"PYTHONPATH\"] = \":\".join(roots)\nenv.setdefault(\"AC_NUMBER_FONT\", \"$font\")\nenv[\"PATH\"] = \"$path\" + (\":\" + env[\"PATH\"] if env.get(\"PATH\") else \"\")\nsys.path[:0] = roots\nimport runpy\nsys.argv[0] = \"$root/$svc.py\"\nrunpy.run_path(sys.argv[0], run_name=\"__main__\")\nEOF\n    chmod +x \"$bin\"\n  done\n",
        "runtime-packages": [
          "python312Full",
          "dejavu_fonts",
          "git",
          "rsync",
          "gcc-unwrapped",
          "zlib"
        ],
        "version": "0.0.2",
        "description": "ac-host bot and sidecars, packaged for a run-mode environment (experiment)"
      },
      "ac-host-services-patchelf": {
        "command": "  set -euo pipefail\n  py=\"$(readlink -f \"$(command -v python3)\")\"\n  uv venv --python \"$py\" \"$out/venv\"\n  UV_PROJECT_ENVIRONMENT=\"$out/venv\" uv sync --frozen --no-install-project --python \"$py\"\n  if [ \"$(uname -s)\" = Linux ]; then\n    auto-patchelf --paths \"$out/venv/lib\" --libs \"$FLOX_ENV/lib\"\n  fi\n  root=\"$out/lib/ac-host\"\n  mkdir -p \"$root\" \"$out/bin\"\n  cp -r bot sidecar shared scripts \"$root/\"\n  printf 'import discord, numpy, scipy.signal, PIL.Image, aiohttp\\nimport auth, details, plugin, bot, skin_livery, skin_uv\\nprint(\"ac-host-check ok:\", \"numpy\", numpy.__version__, \"scipy\", scipy.__version__, \"Pillow\", PIL.__version__)\\n' > \"$root/check.py\"\n  for svc in bot/bot check; do\n    bin=\"$out/bin/ac-host-$(basename \"$svc\")\"\n    cat > \"$bin\" <<EOF\n#!$out/venv/bin/python -u\nimport runpy, sys\nsys.path[:0] = [\"$root/scripts\", \"$root/bot\", \"$root/sidecar\", \"$root/shared\"]\nrunpy.run_path(\"$root/$svc.py\", run_name=\"__main__\")\nEOF\n    chmod +x \"$bin\"\n  done\n",
        "runtime-packages": [
          "python312Full",
          "dejavu_fonts",
          "git",
          "rsync",
          "gcc-unwrapped",
          "zlib"
        ],
        "version": "0.0.1",
        "description": "ac-host services from uv.lock, wheels patched at build time (experiment)"
      }
    }
  },
