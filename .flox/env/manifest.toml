schema-version = "1.14.0"

# This one manifest is three things: the developer's shell (`flox activate`),
# the CI gate (.buildkite/pipeline.yml runs every step under the flox plugin),
# and the runtime image the bot and sidecars run from on ac-box --
# scripts/ci_containerize.sh turns it into `ac-host-env:<sha>` with
# `flox containerize`, and compose/docker-compose.yml runs that image with this
# tree bind-mounted at /repo. Adding a package here is adding it to prod.
#
# The image is containerized in "dev" activation mode (the default), not
# "run": run mode leaves the environment's site-packages off PYTHONPATH, so
# `import discord` fails inside the container. Dev mode is also what CI
# activates, so the image is exactly the closure the tests ran under.


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
scipy.pkg-path = "python312Packages.scipy"
git.pkg-path = "git"
pillow.pkg-path = "python312Packages.pillow"
rsync.pkg-path = "rsync"
numpy.pkg-path = "python312Packages.numpy"
# Race-number rendering needs a scalable font. shared/skin_livery.py raises
# "no scalable font found for the race number" without one, failing five tests in
# scripts/test_skin_livery.py. The series work was developed directly on the box
# and so never ran through this environment, which is why the dependency was
# never declared. AC_NUMBER_FONT overrides the choice.
dejavu_fonts.pkg-path = "dejavu_fonts"
nixfmt-rfc-style.pkg-path = "nixfmt-rfc-style"
gh.pkg-path = "gh"
python312Full.pkg-path = "python312Full"
discordpy.pkg-path = "python312Packages.discordpy"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# The tree's four import roots. In a shell or CI FLOX_ENV_PROJECT is the
# checkout; inside the containerized image there is no project directory, so
# fall back to where compose/docker-compose.yml bind-mounts the tree (AC_REPO,
# /repo). The sidecars import `downtime`, `atomic_json`, `server_health` and
# `series_lib` from shared/ through this path, exactly as the tests do.
#
# Sourced by `flox activate`, `flox activate -c '<cmd>'` (the CI plugin) and
# the image's entrypoint; NOT by `flox activate -- <cmd>` (flox 1.14: `--`
# runs the command without the profile). scripts/ci_test.sh sets PYTHONPATH
# itself for that reason.
common = '''
  ac_root="${FLOX_ENV_PROJECT:-${AC_REPO:-/repo}}"
  export PYTHONPATH="$ac_root/scripts:$ac_root/bot:$ac_root/sidecar:$ac_root/shared${PYTHONPATH:+:$PYTHONPATH}"
  unset ac_root
'''


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


