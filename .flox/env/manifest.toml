schema-version = "1.16.0"

# This one manifest is three things: the developer's shell (`flox activate`),
# the CI gate (.buildkite/pipeline.yml runs every step under the flox plugin),
# and the runtime image the bot and sidecars run from on arcade-box --
# scripts/ci_containerize.sh turns it into `ac-host-env:<sha>` with
# `flox containerize`, and compose/docker-compose.yml runs that image with this
# tree bind-mounted at /repo. Adding a package here is adding it to prod.
#
# The image is containerized in "dev" activation mode (the default), not
# "run": run mode leaves the environment's site-packages off PYTHONPATH, so
# `import discord` fails inside the container. Dev mode is also what CI
# activates, so the image is exactly the closure the tests ran under.


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
scipy.pkg-path = "python312Packages.scipy"
git.pkg-path = "git"
pillow.pkg-path = "python312Packages.pillow"
rsync.pkg-path = "rsync"
numpy.pkg-path = "python312Packages.numpy"
# Race-number rendering needs a scalable font. shared/skin_livery.py raises
# "no scalable font found for the race number" without one, failing five tests in
# scripts/test_skin_livery.py. The series work was developed directly on the box
# and so never ran through this environment, which is why the dependency was
# never declared. AC_NUMBER_FONT overrides the choice.
dejavu_fonts.pkg-path = "dejavu_fonts"
nixfmt-rfc-style.pkg-path = "nixfmt-rfc-style"
gh.pkg-path = "gh"
python312Full.pkg-path = "python312Full"
discordpy.pkg-path = "python312Packages.discordpy"
uv.pkg-path = "uv"
# libstdc++ for the services' PyPI wheels (numpy, scipy); macOS has it in the system.
gcc-unwrapped.pkg-path = "gcc-unwrapped"
gcc-unwrapped.outputs = ["lib"]
gcc-unwrapped.priority = 6
gcc-unwrapped.systems = ["x86_64-linux", "aarch64-linux"]
# zlib for the same wheels (numpy loads libz.so.1); macOS has it in the system.
zlib.pkg-path = "zlib"
zlib.systems = ["x86_64-linux", "aarch64-linux"]
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# The tree's four import roots. In a shell or CI FLOX_ENV_PROJECT is the
# checkout; inside the containerized image there is no project directory, so
# fall back to where compose/docker-compose.yml bind-mounts the tree (AC_REPO,
# /repo). The sidecars import `downtime`, `atomic_json`, `server_health` and
# `series_lib` from shared/ through this path, exactly as the tests do.
#
# Sourced by `flox activate`, `flox activate -c '<cmd>'` (the CI plugin) and
# the image's entrypoint; NOT by `flox activate -- <cmd>` (flox 1.14: `--`
# runs the command without the profile). scripts/ci_test.sh sets PYTHONPATH
# itself for that reason.
common = '''
  ac_root="${FLOX_ENV_PROJECT:-${AC_REPO:-/repo}}"
  export PYTHONPATH="$ac_root/scripts:$ac_root/bot:$ac_root/sidecar:$ac_root/shared${PYTHONPATH:+:$PYTHONPATH}"
  unset ac_root
'''


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]
# Experiment (experiments/run-mode): the bot and sidecars as one package a
# run-mode environment can install. Libraries come from uv.lock via PyPI;
# the interpreter, font and tools from this manifest.
[build.ac-host-services]
description = "ac-host bot and sidecars, packaged for a run-mode environment (experiment)"
version = "0.0.2"
runtime-packages = ["python312Full", "dejavu_fonts", "git", "rsync", "gcc-unwrapped", "zlib"]
command = '''
  set -euo pipefail
  py="$(readlink -f "$(command -v python3)")"
  font="$(readlink -f "$FLOX_ENV/share/fonts/truetype/DejaVuSans.ttf")"
  libs=""
  if [ "$(uname -s)" = Linux ]; then
    # PyPI's manylinux wheels expect these from the system; Nix's Python
    # doesn't provide them, so the wrappers put them on LD_LIBRARY_PATH.
    libs="$(dirname "$(readlink -f "$FLOX_ENV/lib/libstdc++.so.6")"):$(dirname "$(readlink -f "$FLOX_ENV/lib/libz.so.1")")"
  fi
  path="$(dirname "$(readlink -f "$(command -v git)")"):$(dirname "$(readlink -f "$(command -v rsync)")")"

  uv venv --python "$py" "$out/venv"
  UV_PROJECT_ENVIRONMENT="$out/venv" uv sync --frozen --no-install-project --python "$py"

  root="$out/lib/ac-host"
  mkdir -p "$root" "$out/bin"
  cp -r bot sidecar shared scripts "$root/"
  # ac-host-check imports every service module, including the ones that load
  # numpy, scipy and Pillow only for some commands, so a smoke test sees them.
  cat > "$root/check.py" <<'CHECK'
import discord, numpy, scipy.signal, PIL.Image, aiohttp
import auth, details, plugin, bot, skin_livery, skin_uv
print("ac-host-check ok:", "numpy", numpy.__version__, "scipy", scipy.__version__, "Pillow", PIL.__version__, "discord.py", discord.__version__)
CHECK
  for svc in sidecar/auth sidecar/details sidecar/plugin bot/bot check; do
    bin="$out/bin/ac-host-$(basename "$svc")"
    cat > "$bin" <<EOF
#!$out/venv/bin/python -u
# Generated by the ac-host-services build. Sets up the environment the
# service expects, re-executing once so the loader sees LD_LIBRARY_PATH.
import os, sys
env = os.environ
if "$libs" and env.get("AC_HOST_LIBS") != "$libs":
    env["AC_HOST_LIBS"] = "$libs"
    env["LD_LIBRARY_PATH"] = "$libs" + (":" + env["LD_LIBRARY_PATH"] if env.get("LD_LIBRARY_PATH") else "")
    os.execv(sys.executable, [sys.executable, "-u"] + sys.argv)
roots = ["$root/scripts", "$root/bot", "$root/sidecar", "$root/shared"]
env["PYTHONPATH"] = ":".join(roots)
env.setdefault("AC_NUMBER_FONT", "$font")
env["PATH"] = "$path" + (":" + env["PATH"] if env.get("PATH") else "")
sys.path[:0] = roots
import runpy
sys.argv[0] = "$root/$svc.py"
runpy.run_path(sys.argv[0], run_name="__main__")
EOF
    chmod +x "$bin"
  done
'''


# Experiment, third route: the catalog libraries this manifest already locks,
# shipped as runtime-packages. Flox's build wrapper sets PYTHONPATH to them,
# so the services run in run mode with the same versions dev and CI use.
[build.ac-host-catlibs]
description = "ac-host bot and sidecars on the environment's own catalog libraries (experiment)"
version = "0.0.1"
runtime-packages = ["python312Full", "discordpy", "numpy", "scipy", "pillow", "dejavu_fonts", "git", "rsync"]
command = '''
  set -euo pipefail
  root="$out/lib/ac-host"
  mkdir -p "$root" "$out/bin"
  cp -r bot sidecar shared scripts "$root/"
  cat > "$root/check.py" <<'CHECK'
import discord, numpy, scipy.signal, PIL.Image, aiohttp
import auth, details, plugin, bot, skin_livery, skin_uv
print("ac-host-check ok:", "numpy", numpy.__version__, "scipy", scipy.__version__, "Pillow", PIL.__version__, "discord.py", discord.__version__, "aiohttp", aiohttp.__version__)
CHECK
  font="$(readlink -f "$FLOX_ENV/share/fonts/truetype/DejaVuSans.ttf")"
  for svc in sidecar/auth sidecar/details sidecar/plugin bot/bot check; do
    bin="$out/bin/ac-host-$(basename "$svc")"
    cat > "$bin" <<EOF
#!/usr/bin/env python3
import os, runpy, sys
roots = ["$root/scripts", "$root/bot", "$root/sidecar", "$root/shared"]
sys.path[:0] = roots
os.environ["PYTHONPATH"] = ":".join(roots + [p for p in os.environ.get("PYTHONPATH", "").split(":") if p])
os.environ.setdefault("AC_NUMBER_FONT", "$font")
sys.argv[0] = "$root/$svc.py"
runpy.run_path(sys.argv[0], run_name="__main__")
EOF
    chmod +x "$bin"
  done
'''


