schema-version = "1.16.0"

# The runtime environment Flox's docs intend for production: it installs one
# package, the published services, and activates in run mode.
[install]
ac-host-services.pkg-path = "imkarrer/ac-host-services"

[options]
systems = ["aarch64-linux", "aarch64-darwin"]
activate.mode = "run"
