# Series race pack only. /admin quali-close — no GitHub webhook.
# Requires SERIES_ID (ROUND_ID optional). Upload with:
#   buildkite-agent pipeline upload .buildkite/series.yml

agents:
  queue: self

flox_plugin: &flox
  s3-cache-bucket: flox-binary-cache
  s3-cache-endpoint: http://minio:9000
  s3-cache-region: us-east-1
  s3-cache-public-key: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0="
  s3-cache-push: true

steps:
  - label: ":checkered_flag: Series race pack"
    key: series-pack
    command: bash scripts/ci_series_pack.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_series_pack.sh
