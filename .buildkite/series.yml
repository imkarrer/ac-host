# Series race pack only. /admin quali-close — no GitHub webhook.
# Requires SERIES_ID (ROUND_ID optional). Upload with:
#   buildkite-agent pipeline upload .buildkite/series.yml

agents:
  queue: self

env:
  S3_CACHE_BUCKET: flox-binary-cache
  S3_CACHE_ENDPOINT: http://minio:9000
  S3_CACHE_REGION: us-east-1
  S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0="
  S3_CACHE_PUSH: "true"

steps:
  - label: ":checkered_flag: Series race pack"
    key: series-pack
    command: bash scripts/ci_series_pack.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_series_pack.sh
