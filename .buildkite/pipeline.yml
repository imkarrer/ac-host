# Agent on ac-box. Queue=self. MinIO cache at http://minio:9000.
#
# Modes (build env):
#   DOWNTIME=1   → apply folded pending-src + one recycle (03:00 schedule)
#   EMERGENCY=1  → apply-now (drain + resume), skips CI
#   SERIES_ID    → race pack only (/admin quali-close)
#   else         → test, lint, queue-prod, pages (no lobby kick)
#
# Do not unblock old Apply-now steps. Last queue-prod wins; downtime
# recycles once.

agents:
  queue: self

steps:
  - label: ":moon: Downtime apply + recycle"
    key: downtime
    if: build.env("DOWNTIME") == "1"
    command: python3 scripts/ci_downtime.py
    plugins:
      - imkarrer/flox#main:
          <<: &flox
            s3-cache-bucket: flox-binary-cache
            s3-cache-endpoint: http://minio:9000
            s3-cache-region: us-east-1
            s3-cache-public-key: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0="
            s3-cache-push: true
          command: python3 scripts/ci_downtime.py

  - label: ":rocket: Emergency apply now"
    key: emergency
    if: build.env("EMERGENCY") == "1"
    command: python3 scripts/ci_apply_now.py
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: python3 scripts/ci_apply_now.py

  - label: ":python: Unit tests"
    key: test
    if: build.env("DOWNTIME") != "1" && build.env("EMERGENCY") != "1" && (build.env("SERIES_ID") == null || build.env("SERIES_ID") == "")
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_test.sh

  - label: ":nix: Lint"
    key: lint
    if: build.env("DOWNTIME") != "1" && build.env("EMERGENCY") != "1" && (build.env("SERIES_ID") == null || build.env("SERIES_ID") == "")
    command: bash scripts/ci_lint.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_lint.sh

  - wait: ~
    if: build.env("DOWNTIME") != "1" && build.env("EMERGENCY") != "1" && (build.env("SERIES_ID") == null || build.env("SERIES_ID") == "")

  - label: ":package: Queue prod (folded into 03:00)"
    key: queue-prod
    if: build.branch == "main" && build.env("DOWNTIME") != "1" && build.env("EMERGENCY") != "1" && (build.env("SERIES_ID") == null || build.env("SERIES_ID") == "")
    command: python3 scripts/ci_queue_prod.py
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: python3 scripts/ci_queue_prod.py

  - label: ":pages: Publish player page"
    key: pages
    if: build.branch == "main" && build.env("DOWNTIME") != "1" && build.env("EMERGENCY") != "1" && (build.env("SERIES_ID") == null || build.env("SERIES_ID") == "")
    command: python3 scripts/ci_publish_pages.py
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: python3 scripts/ci_publish_pages.py

  - label: ":checkered_flag: Series race pack"
    key: series-pack
    if: build.env("SERIES_ID") != null && build.env("SERIES_ID") != "" && build.env("DOWNTIME") != "1"
    command: bash scripts/ci_series_pack.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_series_pack.sh
