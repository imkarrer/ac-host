# CI only. GitHub push/PR → this file (default pipeline upload).
# Ops and series are sibling pipelines; they cannot recycle from a push.
#
# Agent on ac-box. Queue=self. MinIO cache at http://minio:9000.

agents:
  queue: self

# YAML anchor only — Buildkite ignores this key. Steps merge it with <<: *flox
# and override command. https://buildkite.com/docs/pipelines/configure/yaml
flox_plugin: &flox
  s3-cache-bucket: flox-binary-cache
  s3-cache-endpoint: http://minio:9000
  s3-cache-region: us-east-1
  s3-cache-public-key: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0="
  s3-cache-push: true

steps:
  - label: ":python: Unit tests"
    key: test
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_test.sh

  - label: ":nix: Lint"
    key: lint
    command: bash scripts/ci_lint.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_lint.sh

  - wait: ~

  - label: ":package: Queue prod (folded into downtime)"
    key: queue-prod
    if: build.branch == "main"
    command: python3 scripts/ci_queue_prod.py
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: python3 scripts/ci_queue_prod.py

  - label: ":pages: Publish player page"
    key: pages
    if: build.branch == "main"
    command: python3 scripts/ci_publish_pages.py
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: python3 scripts/ci_publish_pages.py
