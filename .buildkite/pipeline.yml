# CI only. GitHub push/PR → this file (default pipeline upload).
# Ops and series are sibling pipelines; they cannot recycle from a push.
#
# Agent on ac-box. Queue=self. MinIO cache at http://minio:9000.

agents:
  queue: self

env:
  S3_CACHE_BUCKET: flox-binary-cache
  S3_CACHE_ENDPOINT: http://minio:9000
  S3_CACHE_REGION: us-east-1
  S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo="
  S3_CACHE_PUSH: "true"

steps:
  - label: ":python: Unit tests"
    key: test
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_test.sh

  - label: ":nix: Lint"
    key: lint
    command: bash scripts/ci_lint.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_lint.sh

  # The bot/sidecar image: .flox/env/manifest.toml containerized by flox, so
  # the closure the tests above ran under is the closure that ships. Loaded
  # straight into this box's Docker daemon (the agent mounts its socket) as
  # ac-host-env:<sha>, then the entrypoints are imported inside it. Before the
  # wait, on every branch, because an image that cannot be built or cannot run
  # auth.py is as red as a failing test and must block queue-prod the same way.
  # No tag moves here; `latest` is promoted below, after the wait.
  - label: ":docker: Image (flox containerize)"
    key: image
    command: bash scripts/ci_containerize.sh build
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_containerize.sh build

  - wait: ~

  # ac-host-env:<sha> -> ac-host-env:latest, the tag compose/docker-compose.yml
  # runs. Behind the wait for the same reason queue-prod is: a red build must
  # not move the tag the 03:00 recreate (ci_downtime.py) and the boot-time
  # `up -d` (ac-host-static, ac-host-bot units) both start from. Plain docker
  # from the agent; nothing here needs the flox environment.
  - label: ":docker: Promote image to latest"
    key: promote-image
    if: build.branch == "main"
    command: bash scripts/ci_containerize.sh promote

  - label: ":package: Queue prod (folded into downtime)"
    key: queue-prod
    if: build.branch == "main"
    command: python3 scripts/ci_queue_prod.py
    plugins:
      - imkarrer/flox#main:
          command: python3 scripts/ci_queue_prod.py

  - label: ":pages: Publish player page"
    key: pages
    if: build.branch == "main"
    command: python3 scripts/ci_publish_pages.py
    plugins:
      - imkarrer/flox#main:
          command: python3 scripts/ci_publish_pages.py

  # Tell homelab this tree moved. homelab's bump-lock step moves the
  # `ac-host` input in its flake.lock, gates the result and pushes it, so a
  # change to modules/ac-host.nix reaches the box through homelab's closure
  # path (queue-closure -> homelab-deploy.timer at 03:30) instead of waiting
  # for someone to run `nix flake update` by hand. Part III row 24 in
  # homelab/docs/architecture.md.
  #
  # Behind `wait: ~` like queue-prod, for the same reason: a red gate must
  # not become a lock bump. async, because this build has no reason to wait
  # for homelab's; the bump either lands (and gets its own build there) or
  # skips with a message when HOMELAB_PUSH_TOKEN is unset on the agent.
  #
  # The tenant TREE (scripts, compose, content) still deploys the way it
  # always has -- queue-prod above, applied by the 03:00 DOWNTIME=1 build.
  # This step is about the flake input only.
  - trigger: homelab
    label: ":arrow_up: bump homelab's lock"
    if: build.branch == "main"
    async: true
    # A trigger that cannot fire (slug renamed, permission missing) must not
    # redden THIS build -- queue-prod shares it, and a red build stalls the
    # tenant deploy. The bump simply does not happen, and hub-status shows
    # the lock behind its tip.
    soft_fail: true
    build:
      message: "ac-host ${BUILDKITE_COMMIT} went green"
      env:
        HOMELAB_BUMP_INPUT: ac-host
        HOMELAB_BUMP_REV: "${BUILDKITE_COMMIT}"
